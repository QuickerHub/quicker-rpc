name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  docs:
    name: Generated knowledge
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check generated CLI and skill knowledge
        run: node scripts/generate-authoring-docs.mjs --check

  agent:
    name: Offline Agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: agent-gui/pnpm-lock.yaml
      - name: Install locked dependencies including native SQLite
        id: install
        working-directory: agent-gui
        run: pnpm install --frozen-lockfile
      - name: Ensure dependency manifests were not rewritten
        run: git diff --exit-code -- agent-gui/package.json agent-gui/pnpm-lock.yaml
      - name: TypeScript and explicit offline Agent checks
        working-directory: agent-gui
        run: node scripts/check-agent-offline.mjs
      - name: Build and verify relocated production static runtime
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        working-directory: agent-gui
        run: |
          node --test ../scripts/ci/check-static-runtime-closure.test.mjs scripts/static-runtime-native-probe.test.mjs scripts/static-runtime-dependency-graph.test.mjs scripts/runtime-package-metadata.test.mjs scripts/runtime-package-source-files.test.mjs scripts/stage-runtime-packages.test.mjs scripts/verify-static-runtime.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Static runtime closure tests failed' }
          node --import tsx ../scripts/ci/check-static-runtime-closure.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Relocated static runtime closure verification failed' }
      - name: Upload static runtime closure diagnostics
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: static-runtime-closure-${{ runner.os }}
          path: |
            .tmp/static-runtime-closure/run-*/receipt.json
            .tmp/static-runtime-closure/run-*/failure.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Cache pinned NSIS compile tools
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Windows' }}
        uses: actions/cache@v4
        with:
          path: .tmp/nsis-compile-cache
          key: nsis-compile-${{ runner.os }}-builder-25.1.8-nsis-3.0.4.1-resources-3.4.1-${{ hashFiles('agent-gui/pnpm-lock.yaml', 'scripts/ci/check-nsis-template-compile.mjs') }}
      - name: Shell watch response cleanup and natural service exit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: agent-gui
        run: node --conditions=react-server --import tsx --test --test-timeout=15000 service/shell-watch.integration.test.ts
      - name: Compile installer helper and verify pure ownership policy
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Windows' }}
        shell: pwsh
        working-directory: agent-gui
        run: |
          node --input-type=module -e "import {buildInstallerOwnershipHelper} from './scripts/build-installer-ownership-helper.mjs'; await buildInstallerOwnershipHelper(process.cwd());"
          if ($LASTEXITCODE -ne 0) { throw 'Installer helper compilation failed' }
          $fixtureOutput = Join-Path (Resolve-Path '..').Path '.tmp/installer-policy-ci'
          New-Item -ItemType Directory -Force -Path $fixtureOutput | Out-Null
          $policyExecutable = Join-Path $fixtureOutput 'ProcessOwnershipPolicy.Tests.exe'
          $policySource = Join-Path $PWD 'electron\build\installer-helper\ProcessOwnershipPolicy.cs'
          $fixtureSource = Join-Path $PWD 'electron\build\installer-helper\ProcessOwnershipPolicy.Tests.cs'
          & "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe" /nologo /target:exe /optimize+ "/out:$policyExecutable" $policySource $fixtureSource
          if ($LASTEXITCODE -ne 0) { throw 'Installer policy fixture compilation failed' }
          & $policyExecutable
          if ($LASTEXITCODE -ne 0) { throw 'Installer policy fixture failed' }
      - name: Compile production NSIS template with warnings as errors
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os == 'Windows' }}
        timeout-minutes: 5
        shell: pwsh
        working-directory: agent-gui
        run: |
          node --test ../scripts/ci/check-nsis-template-compile.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'NSIS compile runner tests failed' }
          node ../scripts/ci/check-nsis-template-compile.mjs
          if ($LASTEXITCODE -ne 0) { throw 'NSIS template compilation failed' }
      - name: Upload NSIS compile diagnostics
        if: ${{ always() && !cancelled() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: nsis-template-compile-diagnostics
          path: |
            .tmp/nsis-template-compile/**/*.json
            .tmp/nsis-template-compile/**/*.nsi
            .tmp/nsis-template-compile/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Runtime startup cancellation and rejected health body ownership
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: agent-gui
        run: node --conditions=react-server --import tsx --test --test-timeout=15000 service/runtime-start-abort.integration.test.ts service/runtime-health-body.integration.test.ts
      - name: Guarded tool, eval, authoring and trace regressions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci/check-agent-regressions.mjs
      - name: Owned action-open and Explorer loopback lifecycle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: agent-gui
        run: node --conditions=react-server --import tsx --test --test-timeout=15000 lib/designer-resource-action-open.lifecycle.integration.test.ts service/action-explorer-watch.integration.test.ts

  designer-dom:
    name: Designer DOM (Windows Edge)
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: agent-gui/pnpm-lock.yaml
      - name: Install locked dependencies without browser downloads
        working-directory: agent-gui
        run: pnpm install --frozen-lockfile
      - name: Ensure dependency manifests were not rewritten
        run: git diff --exit-code -- agent-gui/package.json agent-gui/pnpm-lock.yaml
      - name: Check DOM gate failure propagation and diagnostic bounds
        run: node --test scripts/ci/check-designer-dom.test.mjs
      - name: Verify installed Edge and run isolated designer DOM regressions
        timeout-minutes: 17
        run: node scripts/ci/check-designer-dom.mjs
      - name: Upload generated DOM failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: designer-dom-windows-edge
          path: |
            .tmp/designer-dom-ci/run-*/receipt.json
            .tmp/designer-dom-ci/run-*/diagnostic-tail.log
            .tmp/designer-dom-ci/run-*/screenshots/**/*.png
            .tmp/action-resource-*.png
            .tmp/color-tool-*.png
            .tmp/error-output-*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  static-spa:
    name: Static SPA (Windows Edge)
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: agent-gui/pnpm-lock.yaml
      - name: Install locked dependencies and native modules
        working-directory: agent-gui
        run: pnpm install --frozen-lockfile
      - name: Ensure dependency manifests were not rewritten
        run: git diff --exit-code -- agent-gui/package.json agent-gui/pnpm-lock.yaml
      - name: Check bounded SPA evidence collection
        run: node --test scripts/ci/collect-static-spa-evidence.test.mjs scripts/ci/check-designer-dom.test.mjs
      - name: Prepare generated CI diagnostics
        shell: pwsh
        run: New-Item -ItemType Directory -Force .tmp/static-spa-ci | Out-Null
      - name: Verify installed headless Edge
        timeout-minutes: 1
        shell: pwsh
        working-directory: agent-gui
        run: |
          node --input-type=module -e "import { probeHostedEdge } from '../scripts/ci/check-designer-dom.mjs'; console.log(JSON.stringify({event:'static-spa-installed-edge',...await probeHostedEdge(process.cwd())}));" 2>&1 | Tee-Object -FilePath ../.tmp/static-spa-ci/browser.log
          exit $LASTEXITCODE
      - name: Run the complete static React and Node SPA integration
        timeout-minutes: 6
        shell: pwsh
        working-directory: agent-gui
        run: |
          pnpm test:static-runtime 2>&1 | Tee-Object -FilePath ../.tmp/static-spa-ci/suite.log
          exit $LASTEXITCODE
      - name: Collect bounded generated SPA failure evidence
        if: ${{ failure() && !cancelled() }}
        run: node scripts/ci/collect-static-spa-evidence.mjs
      - name: Upload generated SPA failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: static-spa-windows-edge
          path: .tmp/static-spa-ci/artifacts/*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  dotnet:
    name: Host-independent .NET
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build shared targets and run offline tests
        shell: pwsh
        run: ./scripts/ci/Test-OfflineDotNet.ps1
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: offline-dotnet-test-results
          path: .tmp/ci-results/**/*.trx
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
